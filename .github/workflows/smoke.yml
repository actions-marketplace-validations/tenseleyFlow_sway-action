name: smoke

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    # Static checks: action.yml schema, bash shellcheck, JS syntax.
    name: lint (action.yml + bash + js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: action.yml .github/workflows/*.yml

      - name: shellcheck entrypoint.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck src/entrypoint.sh

      - name: node syntax check
        # Verify post-comment.js parses under Node 20 (the runtime
        # actions/github-script@v7 ships with). Catches typos that
        # would otherwise only surface at action-invocation time.
        run: node -c src/post-comment.js

  entrypoint-stub:
    # Exercises the bash entrypoint end-to-end against a stubbed
    # ``python -m dlm_sway`` so we don't pay model-download cost on
    # every PR. Validates: install short-circuit when venv exists,
    # output emission to $GITHUB_OUTPUT, fail-on policy translation.
    name: entrypoint (stubbed sway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build a stubbed venv
        # Pre-create the venv at the path entrypoint.sh expects, then
        # drop the stub package into its site-packages. Entrypoint
        # sees the venv already exists and skips its `pip install`.
        run: |
          set -eux
          VENV="${RUNNER_TEMP}/action_path/.venv"
          mkdir -p "$(dirname "${VENV}")"
          python -m venv "${VENV}"
          SITE="$("${VENV}/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cp -r tests/_stub_dlm_sway "${SITE}/dlm_sway"

      - name: Run entrypoint
        env:
          SWAY_ACTION_PATH: ${{ runner.temp }}/action_path
          SWAY_SPEC_PATH: examples/sway.yaml
          SWAY_FAIL_ON: fail
          SWAY_VERSION: 0.1.0
          GITHUB_OUTPUT: ${{ runner.temp }}/gh_output
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_RUN_ID: smoke-stub
        run: |
          : > "${GITHUB_OUTPUT}"
          bash src/entrypoint.sh

      - name: Assert outputs match canned report
        env:
          GITHUB_OUTPUT_FILE: ${{ runner.temp }}/gh_output
        run: |
          set -eux
          cat "${GITHUB_OUTPUT_FILE}"
          grep -q '^verdict=pass$' "${GITHUB_OUTPUT_FILE}"
          grep -q '^sway-score=0.8400$' "${GITHUB_OUTPUT_FILE}"
          grep -q '^report-path=' "${GITHUB_OUTPUT_FILE}"
          grep -q '^markdown-path=' "${GITHUB_OUTPUT_FILE}"

  self-test:
    # End-to-end: run the action against itself on a PR with a real
    # SmolLM2-135M LoRA. Slow (~5 min) but the only way to exercise
    # actions/github-script + post-comment.js with a real PR context.
    # Skipped on push events (no pull_request payload).
    name: self-test (real adapter)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, entrypoint-stub]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build a tiny LoRA adapter
        # Mirrors sway's own integration-test pattern: SmolLM2-135M +
        # randomly-initialized LoRA over q_proj/v_proj. Fast on CI,
        # gives the action a real PEFT directory to score against.
        run: |
          python -m pip install --quiet "dlm-sway[hf]==0.1.0"
          python tests/build_adapter.py ./adapter

      - uses: ./
        with:
          spec-path: examples/sway.yaml
          fail-on: never  # adapter is random — any verdict is fine
          comment-on-pr: true
          upload-artifact: true
